{% extends "base.html" %}

{% block content %}
<section class="hero" style="min-height: 80vh; display: flex; align-items: center; padding: 100px 24px;">
    <div class="hero-container">
        <div style="max-width: 550px; margin: 0 auto; background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);">
            
            <div style="text-align: center; margin-bottom: 30px;">
                <i class="fas fa-envelope" style="font-size: 50px; color: #0066CC; margin-bottom: 15px;"></i>
                <h2 style="color: #0066CC; margin-bottom: 10px;">✉️ Обратная связь</h2>
                <p style="color: #666;">Напишите нам, мы всегда рады помочь</p>
            </div>
            
            <form method="POST" action="/feedback">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Ваше имя:</label>
                    <input type="text" name="name" value="{{ session.username or '' }}">
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email:</label>
                    <input type="email" name="email" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-comment"></i> Сообщение:</label>
                    <textarea name="message" rows="5" required placeholder="Расскажите о вашем опыте использования Scootify..."></textarea>
                </div>
                
                <button type="submit" class="btn-submit">📨 Отправить сообщение</button>
            </form>
        </div>
    </div>
</section>

<style>
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #1E293B;
}
.form-group label i {
    margin-right: 8px;
    color: #0066CC;
}
.form-group input, .form-group textarea {
    width: 100%;
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus {
    outline: none;
    border-color: #0066CC;
    box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
}
.btn-submit {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #0066CC, #00B3B3);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0,102,204,0.3);
}
</style>
{% endblock %}

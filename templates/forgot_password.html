{% extends "base.html" %}

{% block title %}Восстановление пароля - Scootify{% endblock %}

{% block content %}
<div class="forgot-password-container">
    <div class="forgot-password-card">
        <h2 style="text-align: center; margin-bottom: 10px; color: #0066CC;">🔑 Восстановление пароля</h2>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Мы поможем вам восстановить доступ</p>
        
        {% if not reset_mode %}
            <form method="POST" action="/forgot_password">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Ваш Email:</label>
                    <input type="email" name="email" required placeholder="example@email.com">
                </div>
                <button type="submit" class="btn-submit">Отправить</button>
            </form>
        {% else %}
            <form method="POST" action="/reset_password">
                <input type="hidden" name="email" value="{{ email }}">
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Новый пароль:</label>
                    <input type="password" name="new_password" required placeholder="минимум 4 символа">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Подтвердите пароль:</label>
                    <input type="password" name="confirm_password" required placeholder="повторите пароль">
                </div>
                <button type="submit" class="btn-submit" style="background: #27ae60;">Сбросить пароль</button>
            </form>
        {% endif %}
        
        <p style="text-align: center; margin-top: 25px;">
            <a href="/login" style="color: #0066CC;">← Вернуться к входу</a>
        </p>
    </div>
</div>
{% endblock %}
